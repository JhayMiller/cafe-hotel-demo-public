#cloud-config
# CHU-DEP-002 — Bootstrap Oracle Cloud Always Free, Ubuntu ARM64.
# No instala la aplicación, no usa secretos y no crea recursos OCI de pago.
# Adjuntar en Create Instance > Advanced options > Management > Initialization script.
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - gnupg
  - openssl
  - unzip
  - postgresql-client
write_files:
  - path: /usr/local/sbin/gennesi-cafe-hotel-bootstrap
    owner: root:root
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /etc/os-release
      if [[ "$ID" != ubuntu ]]; then
        echo 'Solo se admite Ubuntu para este bootstrap' >&2
        exit 1
      fi
      install -m 0755 -d /etc/apt/keyrings
      curl --fail --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg \
        | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu %s stable\n' \
        "$(dpkg --print-architecture)" "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      install -m 0750 -d /opt/gennesi/cafe-hotel
      printf '%s\n' 'CHU BOOTSTRAP OK: Docker/Compose instalados. Falta DNS, código y secretos seguros.' > /var/log/gennesi-cafe-hotel-ready.log
      docker compose version >> /var/log/gennesi-cafe-hotel-ready.log
runcmd:
  - [ bash, -lc, '/usr/local/sbin/gennesi-cafe-hotel-bootstrap' ]
final_message: 'Configuración inicial de CHU finalizada: revisar sudo cat /var/log/gennesi-cafe-hotel-ready.log y /var/log/cloud-init-output.log. Aún NO se instaló la aplicación.'
